<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>関東高速道路デモ | Flex Railway Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101820;color:#edf3f7;font:14px system-ui,sans-serif}header{padding:14px 18px;background:#182631}h1{font-size:19px;margin:0 0 6px}p{margin:5px 0;color:#c0cdd5}nav{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px}button{background:#273c49;color:white;border:1px solid #526878;border-radius:7px;padding:9px 13px;cursor:pointer}button[aria-pressed=true]{background:#146b86;border-color:#6fd7f3}#map{height:calc(100dvh - 185px);min-height:380px}#status{padding:7px 16px;font-size:12px}a{color:#9cdbff}</style></head>
<body><header><h1>関東高速道路｜試験プロット</h1><p>OpenStreetMapの実際の道路線形を取得して表示。鉄道本体とは分離した実験ページです。</p></header>
<nav id="filters" aria-label="路線フィルター"></nav><div id="status" role="status">地図を準備中…</div><div id="map" aria-label="関東高速道路地図"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const ROUTES=[{id:'tomei',label:'東名高速道路',match:['東名高速道路','東名高速'],color:'#4cc9f0'},{id:'chuo',label:'中央自動車道',match:['中央自動車道','中央道'],color:'#ffba66'},{id:'kanetsu',label:'関越自動車道',match:['関越自動車道','関越道'],color:'#b8e986'}];
const map=L.map('map').setView([35.73,139.42],9);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const layers=new Map(),buttons=new Map(),status=document.querySelector('#status');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
for(const r of ROUTES){const b=document.createElement('button');b.textContent=r.label;b.setAttribute('aria-pressed','true');b.onclick=()=>{const layer=layers.get(r.id);if(!layer)return;const visible=map.hasLayer(layer);visible?map.removeLayer(layer):map.addLayer(layer);b.setAttribute('aria-pressed',String(!visible))};document.querySelector('#filters').append(b);buttons.set(r.id,b)}
// Trial-sized bounding box, not a complete highway inventory. Overpass uses live OSM ways.
const query='[out:json][timeout:60];way["highway"="motorway"]["name"~"東名高速|中央自動車道|中央道|関越自動車道|関越道"](35.35,138.85,36.25,140.10);out geom;';
async function load(){status.textContent='OpenStreetMap道路形状を取得中…';try{const res=await fetch('https://overpass.kumi.systems/api/interpreter',{method:'POST',body:new URLSearchParams({data:query})});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();let count=0;for(const r of ROUTES){const ways=data.elements.filter(w=>r.match.some(n=>(w.tags?.name||'').includes(n))&&w.geometry?.length>1);const group=L.layerGroup();for(const w of ways){L.polyline(w.geometry.map(p=>[p.lat,p.lon]),{color:r.color,weight:4,opacity:.85}).bindPopup('<b>'+esc(w.tags.name)+'</b><br>OSM way '+w.id).addTo(group)}group.addTo(map);layers.set(r.id,group);count+=ways.length}status.textContent='取得済み: '+count+'道路区間（3路線、関東の一部）｜OSM / Overpass API｜経路探索・料金・IC接続は未対応';if(!count)throw Error('対象データ0件')}catch(e){status.textContent='取得できませんでした: '+e.message+'。Overpass APIの混雑・通信制限の可能性があります。再読み込みしてください。';}}
load();
</script><footer style="padding:9px 16px;font-size:12px">実験データ: <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors (ODbL)</a>。公式の道路案内ではありません。<a href="/">鉄道路線図に戻る</a></footer></body></html>
